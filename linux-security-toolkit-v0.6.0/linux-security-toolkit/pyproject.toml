[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-security-toolkit"
version = "0.6.0"
description = "Linux security risk assessment toolkit (native checks, file integrity, Nmap, Trivy, Lynis)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "rich>=13.7"]

[project.scripts]
lstk = "lstk.cli:app"

[tool.setuptools.packages.find]
include = ["lstk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.optional-dependencies]
test = ["pytest>=8.0"]
